<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#151515;color:#d8d2c5;overflow:hidden}
body{display:grid;grid-template-columns:260px 1fr;gap:64px;align-items:center;padding:0 90px;box-sizing:border-box;
  background:radial-gradient(900px 420px at 70% -80px,rgba(176,141,87,.13),transparent 70%),#151515}
.p{width:260px;height:340px;border-radius:130px 130px 3px 3px;overflow:hidden;border:2px solid #2b2a27;outline:2px solid #2b2a27;outline-offset:10px}
.p img{width:100%;height:100%;object-fit:cover}
.k{font:400 20px "IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:#b08d57;margin:0 0 22px}
h1{font:500 92px/1 "Cormorant Garamond",serif;margin:0;color:#ece6d8;letter-spacing:-.01em}
.r{font:italic 400 38px/1.25 "Cormorant Garamond",serif;margin:22px 0 0;color:#d8d2c5}
.m{font:400 20px "IBM Plex Mono",monospace;color:#8b867b;margin:30px 0 0;letter-spacing:.05em}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:#b08d57}
</style></head>
<body>
<div class="p"><img src="portrait.jpg" alt=""></div>
<div><p class="k">Резюме · MMXXVI</p><h1>Тимур Шакиров</h1>
<p class="r">Fullstack-разработчик. Языковые модели в продуктовых системах.</p>
<p class="m">timaxlacs.github.io/v2</p></div>
<div class="bar"></div>
</body></html>
