    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function copy(text, message) {
      const done = () => toast(message || "Скопировано");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        return;
      }
      fallbackCopy(text, done);
    }

    function fallbackCopy(text, done) {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      done();
    }

    function photo(key) {
      return PHOTOS[key];
    }

    function charClass(title) {
      return title.length <= 46 ? "ok" : "bad";
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      const bits = [`<button class="tab active" data-tab="profile" type="button">Профиль</button>`];
      LISTINGS.forEach((item) => {
        bits.push(`<button class="tab" data-tab="${item.id}" type="button">${item.tab}</button>`);
      });
      tabs.innerHTML = bits.join("");
      tabs.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        openTab(button.dataset.tab);
      });
    }

    function openTab(id) {
      document.querySelectorAll(".tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === id);
      });
      document.getElementById("profile").classList.toggle("active", id === "profile");
      const ads = document.getElementById("ads");
      const isAd = id !== "profile";
      ads.classList.toggle("active", isAd);
      if (isAd) ads.innerHTML = renderAd(LISTINGS.find((item) => item.id === id));
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function bindAd(item) {
      const root = document.getElementById("ads");
      const body = root.querySelector("#ad-body");
      if (!body) return;
      body.textContent = item.body;
      root.querySelectorAll(".thumbs button").forEach((button) => {
        button.onclick = () => {
          root.querySelectorAll(".thumbs button").forEach((el) => el.classList.remove("on"));
          button.classList.add("on");
          root.querySelector("#main-photo").src = button.dataset.src;
          root.querySelector("#main-photo").alt = button.dataset.cap;
        };
      });
    }

    const adsRoot = document.getElementById("ads");
    renderTabs();
    renderProfile();

    const observer = new MutationObserver(() => {
      const id = document.querySelector(".tab.active")?.dataset.tab;
      const item = LISTINGS.find((entry) => entry.id === id);
      if (item) bindAd(item);
    });
    observer.observe(adsRoot, { childList: true });
